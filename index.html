<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de Combustible · Logística y Operaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --page:#f3f5f9;--surface:#ffffff;--surface2:#f7f8fb;--ink:#0f1a2b;--ink2:#4a5568;--muted:#7b8494;--line:#e3e7ee;--grid:#e8ebf0;--base:#c3c9d4;
  --brand:#0b2a5b;--brand2:#123d7f;--accent:#f2a900;--logc:#1c5cab;--opsc:#0f8a63;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --st-good:#0ca30c;--st-warn:#e8a200;--st-bad:#d03b3b;--good-ink:#006300;--bad-ink:#b42828;
  --shadow:0 1px 2px rgba(15,26,43,.06),0 4px 16px rgba(15,26,43,.05);--r:14px;
  color-scheme:light;
}
[data-theme="dark"]{
  --page:#0b1220;--surface:#131c2c;--surface2:#182335;--ink:#eef2f8;--ink2:#b9c3d3;--muted:#8592a6;--line:#24324a;--grid:#223049;--base:#3a4a66;
  --brand:#0a1f44;--brand2:#14336b;--logc:#5598e7;--opsc:#29c48f;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#13a313;--s7:#9085e9;--s8:#e66767;
  --st-warn:#fab219;--good-ink:#3fd13f;--bad-ink:#ff8080;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--s1)}
button{font-family:inherit}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topin{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:10px 22px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;white-space:nowrap}
.logo .mk{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--brand);font-weight:800;font-size:15px}
.logo b{display:block;font-size:13.5px;letter-spacing:.06em}
.logo small{display:block;font-size:11px;opacity:.75;letter-spacing:.02em}
.topnav{display:flex;gap:4px;flex:1}
.topnav a{color:#dbe6ff;text-decoration:none;padding:8px 13px;border-radius:9px;font-weight:600;font-size:13.5px}
.topnav a:hover{background:rgba(255,255,255,.1)}
.topnav a.on{background:rgba(255,255,255,.16);color:#fff}
.tright{display:flex;align-items:center;gap:8px}
.ibtn{background:rgba(255,255,255,.12);border:0;color:#fff;height:34px;min-width:34px;padding:0 11px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px}
.ibtn:hover{background:rgba(255,255,255,.2)}
.dbdot{width:9px;height:9px;border-radius:50%;background:#9aa6b8;display:inline-block}
.dbdot.ok{background:#3ddc84}.dbdot.off{background:#f2a900}
main{max-width:1360px;margin:0 auto;padding:22px 22px 70px}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}
.hero{background:radial-gradient(1200px 300px at 0% 0%,rgba(42,120,214,.18),transparent),linear-gradient(135deg,var(--brand),#0d3a7a 60%,#114a96);color:#fff;border-radius:22px;padding:30px 34px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(242,169,0,.13)}
.hero .date{margin:0 0 4px;opacity:.75;font-size:13px}
.hero h1{font-size:32px;font-weight:800}
.hero h1 span{color:var(--accent)}
.hero .lead{margin:14px 0 10px;font-size:15.5px;color:#e6eeff}
.hero .muted{color:#b4c4e4}
.prices{display:grid;gap:10px;margin-bottom:16px;position:relative;z-index:1}
.prow{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ptag{font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:6px 10px;border-radius:8px;min-width:104px;text-align:center}
.ptag.log{background:#2a78d6}.ptag.ops{background:#12946b}
.pchips{display:flex;flex-wrap:wrap;gap:7px;flex:1}
.pchip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:5px 10px;border-radius:999px;font-size:13px;color:#e6eeff}
.pchip b{color:#fff;font-size:14px;margin-right:3px}
.pchip.auto{border-color:rgba(242,169,0,.5)}
.summary{background:rgba(255,255,255,.07);border-radius:14px;padding:14px 18px;position:relative;z-index:1;font-size:14.5px;color:#eef3ff}
.summary p{margin:6px 0}
.summary .badge{vertical-align:1px}
.sect{margin:28px 0 12px;font-size:18px}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.area-card{all:unset;cursor:pointer;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:20px 22px;display:block;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.area-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--logc)}
.area-card.ops:before{background:var(--opsc)}
.area-card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(15,26,43,.12)}
.area-card:focus-visible{outline:3px solid var(--s1)}
.ac-top{display:flex;gap:14px;align-items:center}
.ac-top h3{font-size:20px}
.ac-top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ac-ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(42,120,214,.12);color:var(--logc);flex:none}
.ops .ac-ico{background:rgba(15,138,99,.12);color:var(--opsc)}
.ac-go{margin-left:auto;font-weight:700;color:var(--s1);font-size:14px}
.ac-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.ac-kpis div{background:var(--surface2);border-radius:11px;padding:10px 12px}
.ac-kpis span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.ac-kpis b{font-size:20px;display:block;margin:2px 0}
.ac-kpis em{font-style:normal;font-size:11.5px;color:var(--muted)}
.areahead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.ah-t{display:flex;gap:14px;align-items:center}
.areahead h1{font-size:26px;font-weight:800}
.crumb{margin:0;font-size:12.5px;color:var(--muted)}.crumb a{color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters label,.range label,.simctl label,.cmpbar label{display:flex;flex-direction:column;font-size:11.5px;font-weight:700;color:var(--muted);gap:3px;text-transform:uppercase;letter-spacing:.03em}
select,input[type=date],input[type=number],input[type=search]{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-height:36px}
select:focus,input:focus{outline:2px solid var(--s1);outline-offset:0}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;height:38px}
.seg button{border:0;background:none;padding:0 13px;border-radius:7px;font-weight:700;color:var(--ink2);cursor:pointer;font-size:13px}
.seg button.on{background:var(--brand2);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 18px;overflow-x:auto;position:sticky;top:54px;background:var(--page);z-index:20;padding-top:6px}
.tabs a{padding:10px 16px;text-decoration:none;color:var(--ink2);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.blockhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.blockhead h2{font-size:21px}
.sub{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.bh-tools,.range{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.chk{display:inline-flex !important;flex-direction:row !important;align-items:center;gap:6px;font-size:12.5px !important;text-transform:none !important;letter-spacing:0 !important;color:var(--ink2) !important;font-weight:600 !important;background:var(--surface);border:1px solid var(--line);padding:7px 10px;border-radius:9px;cursor:pointer}
.btn{background:var(--brand2);color:#fff;border:0;padding:9px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:13.5px;min-height:38px}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:default}
.btn.xls{background:#107c41;box-shadow:0 2px 8px rgba(16,124,65,.3)}
.btn.ghost{background:transparent;color:var(--s1);border:1px solid var(--line)}
.lnk{background:none;border:0;color:var(--s1);cursor:pointer;font-weight:700;padding:4px}
.lnk.danger{color:var(--st-bad)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpis.k3{grid-template-columns:repeat(3,1fr);margin:0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow);min-width:0}
.kpi.hero{background:linear-gradient(140deg,var(--brand2),var(--s1));color:#fff;border:0}
.kpi.hero .kl,.kpi.hero .ks{color:#dfe9ff}
.kpi.hero .dl.up{color:#b8ffb8}.kpi.hero .dl.down{color:#ffd0d0}
.kl{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.kv{font-size:24px;font-weight:800;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv small{font-size:13px;font-weight:600;opacity:.8}
.ks{font-size:12px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.card.good-edge{border-top:3px solid var(--st-good)}.card.bad-edge{border-top:3px solid var(--st-bad)}
.ch{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 16px 6px;flex-wrap:wrap}
.ch h3{font-size:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.cb{padding:6px 16px 14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2>.card{margin-bottom:16px}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface2);border-radius:12px;border:1px dashed var(--line)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-good{background:rgba(12,163,12,.14);color:var(--good-ink)}
.b-ok{background:rgba(27,175,122,.15);color:#0b7a53}
.b-warn{background:rgba(232,162,0,.18);color:#8a5d00}
.b-bad{background:rgba(208,59,59,.14);color:var(--bad-ink)}
.b-na{background:var(--surface2);color:var(--muted)}
[data-theme="dark"] .b-ok{color:#3fd6a0}[data-theme="dark"] .b-warn{color:#ffc84d}
.hero .badge,.kpi.hero .badge{background:rgba(255,255,255,.92)}
.dl{font-size:12px;font-weight:700;white-space:nowrap}
.dl.up{color:var(--good-ink)}.dl.down{color:var(--bad-ink)}.dl.neu,.dl.flat{color:var(--muted)}
.tg{color:var(--good-ink);font-weight:700}.tb{color:var(--bad-ink);font-weight:700}.tw{color:#b07800;font-weight:700}
/* tablas */
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:800;padding:8px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th.sa:after{content:" ▲"}th.sd:after{content:" ▼"}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--surface2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.more,.less{margin-top:8px;background:none;border:1px solid var(--line);color:var(--s1);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700}
.tsearch{display:flex;gap:10px;align-items:center;margin-bottom:8px}.tsearch input{flex:1;max-width:320px}.tsearch span{color:var(--muted);font-size:12px}
table.cov td{text-align:center}table.cov td:first-child{text-align:left;white-space:nowrap}table.cov td.on{color:var(--good-ink);font-weight:800}
/* gráficas */
.viz{display:block;overflow:visible;font-family:inherit}
.viz .grid{stroke:var(--grid);stroke-width:1}
.viz .base{stroke:var(--base);stroke-width:1}
.viz .ax{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.viz .lab{fill:var(--ink2);font-size:11.5px}
.viz .vl{fill:var(--ink2);font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
.viz .ref{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 4;opacity:.55}
.viz .reft{fill:var(--ink2);font-size:10.5px;font-weight:700}
.viz .cross{stroke:var(--muted);stroke-width:1;opacity:0}
.viz .xh:hover .cross{opacity:.6}
.viz .hit:hover rect:not([fill=transparent]){filter:brightness(1.12)}
.viz .dt1{fill:var(--ink);font-size:20px;font-weight:800}.viz .dt2{fill:var(--muted);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--ink2)}
.legend i,.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dleg{flex:1;min-width:200px;display:grid;gap:6px}
.dleg div{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;font-size:12.8px}
.dleg i{width:11px;height:11px;border-radius:3px}.dleg b{font-variant-numeric:tabular-nums}.dleg em{font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#tip{position:fixed;left:0;top:0;pointer-events:none;background:#0f1a2b;color:#fff;padding:8px 11px;border-radius:9px;font-size:12.5px;line-height:1.45;opacity:0;transition:opacity .1s;z-index:100;max-width:320px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
[data-theme="dark"] #tip{background:#eef2f8;color:#0f1a2b}
/* análisis */
.insights{margin:0;padding-left:18px;display:grid;gap:7px}
.insights li{line-height:1.5}
.analysis-card{border-left:4px solid var(--accent)}
.analysis{background:var(--surface2);border-radius:12px;padding:12px 16px;margin:10px 0 14px}
.analysis h4{margin-bottom:6px;font-size:13px}
/* comparativo */
.cmp{border:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--surface2))}
.cmpbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.cmpbar .vs{font-weight:800;color:var(--muted);padding-bottom:9px}
.note{color:var(--muted);font-size:12.5px;margin:8px 0}
.cmpk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.ck{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cv{display:flex;align-items:baseline;gap:6px;margin:4px 0;flex-wrap:wrap}
.cv span{color:var(--muted);font-weight:600}.cv b{font-size:18px}.cv .arrow{font-size:12px}
.cmpg{margin-top:16px}.cmpg h4{font-size:14px;margin-bottom:8px}
/* choferes */
.quads{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.quad{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--qc);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.quad b{font-size:24px;display:block}.quad span{font-weight:700;font-size:13px}.quad em{display:block;font-style:normal;color:var(--muted);font-size:12px;margin-top:2px}
/* simulador */
.sim{border:1px solid rgba(42,120,214,.35)}
.simctl{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.simctl .grow{flex:1;min-width:240px}
.simctl input[type=range]{width:100%;accent-color:var(--s1)}
.simctl input[type=number]{width:90px}
.simres{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.sr{flex:1;min-width:150px;background:var(--surface2);border-radius:12px;padding:12px 14px}
.sr span{display:block;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase}
.sr b{font-size:28px;display:block}.sr em{font-style:normal;color:var(--ink2);font-size:12.5px}
.sr.up{background:linear-gradient(140deg,rgba(12,163,12,.13),rgba(27,175,122,.08))}.sr.up b{color:var(--good-ink)}
.sarrow{display:grid;place-items:center;font-size:22px;color:var(--muted)}
.simw h4{margin:14px 0 6px;font-size:13.5px}
/* carga */
.dbstate{margin:0;font-size:13px}.dbstate .ok{color:var(--good-ink);font-weight:700}.dbstate .warn{color:#b07800;font-weight:700}
.lead2{color:var(--ink2);max-width:900px}
.upgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:14px 0 18px}
.upcol{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.upcol h3{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--logc)}.upcol.ops h3{color:var(--opsc)}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;position:relative;transition:border-color .15s,background .15s}
.drop:hover{border-color:var(--s1);background:var(--surface2)}
.drop.busy{opacity:.6}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop b{display:block}.drop span{font-size:12px;color:var(--muted)}
.pend{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pend>div:first-child{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pend.err span{color:var(--bad-ink)}
.pdet{font-size:12.8px;flex:1;min-width:260px}
.pdet .warn,.pend .warn{color:#b07800;font-weight:700}
.tag{background:rgba(42,120,214,.12);color:var(--s1);font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px}
.pactions{display:flex;gap:10px;margin-top:12px}
/* modal y toasts */
#modal{position:fixed;inset:0;background:rgba(8,14,26,.55);display:none;place-items:center;z-index:60;padding:20px}
#modal.open{display:grid}
.mbox{background:var(--surface);border-radius:16px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbox header,.mbox footer{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.mbox header{border-bottom:1px solid var(--line)}.mbox footer{border-top:1px solid var(--line);justify-content:flex-end}
.mbody{padding:14px 18px;display:grid;gap:12px}
.mbody label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink2)}
.mbody label.chk{flex-direction:row}
.x{background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted)}
#toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:90}
.toast{background:#0f1a2b;color:#fff;padding:11px 15px;border-radius:11px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600;max-width:380px;transition:opacity .4s,transform .4s}
.toast.ok{border-left:4px solid #3ddc84}.toast.warn{border-left:4px solid var(--accent)}
.toast.out{opacity:0;transform:translateY(8px)}
footer.foot{max-width:1360px;margin:0 auto;padding:0 22px 30px;color:var(--muted);font-size:12px}
@media (max-width:1100px){.kpis,.cmpk{grid-template-columns:repeat(3,minmax(0,1fr))}.quads{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){.grid2,.areas,.upgrid{grid-template-columns:1fr}.ac-kpis{grid-template-columns:repeat(2,1fr)}.topnav{display:none}.hero{padding:22px}.hero h1{font-size:25px}main{padding:14px}.tabs{top:54px}}
@media (max-width:520px){.kpis,.cmpk{grid-template-columns:repeat(2,minmax(0,1fr))}.kv{font-size:20px}}

table.cov th{text-align:center}table.cov th:first-child{text-align:left}
.areas{margin-bottom:18px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px}

.logo .lg{height:34px;width:auto;display:block}
.logo .sep{width:1px;height:28px;background:rgba(255,255,255,.3)}
body:not(.authed) .topbar,body:not(.authed) main,body:not(.authed) footer.foot{display:none}
#login{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(900px 500px at 20% 10%,#0a4bb0,transparent),#003087;padding:20px}
body.authed #login{display:none}
.lbox{width:100%;max-width:380px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:30px 28px;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.35);display:grid;gap:12px;backdrop-filter:blur(6px)}
.lbox img{width:100%;max-width:300px;margin:0 auto 4px;display:block}
.lbox h1{font-size:20px;text-align:center}.lbox>p{margin:-8px 0 8px;text-align:center;color:#c9d7f2;font-size:13px}
.lbox label{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:#dbe6ff}
.lbox input:not([type=checkbox]){font-family:inherit;font-size:15px;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.95);color:#0f1a2b}
.lbox .rem{display:flex;align-items:center;gap:8px;font-weight:600}
.lbox button{margin-top:4px;background:#f2a900;color:#0b2a5b;border:0;border-radius:10px;padding:12px;font-weight:800;font-size:15px;cursor:pointer}
.lbox button:hover{filter:brightness(1.06)}
.lerr{min-height:18px;color:#ffd0d0;font-size:13px;text-align:center;font-weight:700}
.lbox.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.notice{background:rgba(242,169,0,.13);border:1px solid rgba(242,169,0,.45);color:var(--ink);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:13px}

details.cmp>summary{list-style:none;cursor:pointer;user-select:none;padding-bottom:14px}
details.cmp>summary::-webkit-details-marker{display:none}
details.cmp>summary:hover h3{color:var(--s1)}
details.cmp .chev{font-size:18px;color:var(--muted);transition:transform .2s;transform:rotate(-90deg);padding-top:2px}
details.cmp[open] .chev{transform:none}
details.cmp[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.btn.sm{min-height:34px;padding:7px 12px;font-size:12.5px;text-decoration:none;display:inline-flex;align-items:center;margin-left:auto}
.analysis.why{background:linear-gradient(135deg,rgba(42,120,214,.10),rgba(242,169,0,.08));border-left:4px solid var(--s1)}
.eff{display:inline-block;min-width:92px;font-weight:800;font-variant-numeric:tabular-nums}
.eff.up{color:var(--bad-ink)}.eff.down{color:var(--good-ink)}

.cebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.cepick{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:10px;background:var(--surface);padding-left:10px}
.cepick span{font-weight:800;color:var(--muted);margin-right:6px}
.cepick input{border:0;min-width:200px;background:transparent}
.cepick .x{font-size:18px;padding:0 8px}
.ceinfo{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
table.cet tr.grp td{background:var(--surface2);font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.cet td.best{color:var(--good-ink);font-weight:800}

#combo{position:fixed;z-index:150;display:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.25);overflow:auto;padding:4px}
#combo .co{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;white-space:nowrap}
#combo .co.hl,#combo .co:hover{background:var(--surface2);color:var(--s1)}
#combo .co.cur{font-weight:800}
#combo .cnone{padding:8px 12px;color:var(--muted);font-size:12.5px}
.cepick{cursor:pointer}.cepick .cdrop{color:var(--muted);padding:0 10px;font-size:12px}
.cepick:hover{border-color:var(--s1)}

/* ===== Imágenes ===== */
.mosaic{grid-column:2;grid-row:1;display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:14px 14px 14px 0;min-height:100%}
.mosaic figure{margin:0;position:relative;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.mosaic .m1{grid-row:1/3}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02);transition:transform 6s ease}
.hero:hover .mosaic img{transform:scale(1.08)}
.mosaic figcaption{position:absolute;left:10px;bottom:10px;background:rgba(10,31,68,.78);color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:7px}
section.hero:after{z-index:0}
.mosaic .m1 img{object-position:center 88%}
.area-card{padding:0}
.ac-photo{position:relative;height:160px;overflow:hidden}
.ac-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.area-card:hover .ac-photo img{transform:scale(1.05)}
.ac-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,31,68,.75))}
.ac-photo span{position:absolute;left:16px;bottom:12px;z-index:1;color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em}
.area-card .ac-top,.area-card .ac-kpis{margin-left:22px;margin-right:22px}
.area-card .ac-top{margin-top:16px}.area-card .ac-kpis{margin-bottom:20px}
.abanner{position:relative;height:150px;border-radius:20px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.abanner img{position:absolute;right:0;top:0;width:62%;height:100%;object-fit:cover}
.abanner:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#0b2a5b 0%,#0b2a5b 36%,rgba(11,42,91,.82) 52%,rgba(11,42,91,.15) 100%)}
.abanner.ops:before{background:linear-gradient(90deg,#0a3d33 0%,#0d4a3d 36%,rgba(13,74,61,.82) 52%,rgba(13,74,61,.12) 100%)}
.abtxt{position:relative;z-index:2;padding:22px 28px;color:#fff;max-width:60%}
.abtxt h1{font-size:30px;font-weight:800;color:#fff}
.abtxt p{margin:4px 0 0;color:#d6e2f7;font-size:13.5px}
.abtxt .crumb,.abtxt .crumb a{color:#b9cbe9}
.areahead{justify-content:flex-end}
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.ptiles.three{grid-template-columns:repeat(3,1fr)}
.ptile{position:relative;height:170px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.ptile img{width:100%;height:100%;object-fit:cover;display:block}
.ptile:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,31,68,.88) 0%,rgba(10,31,68,.55) 45%,rgba(10,31,68,0) 75%)}
.ptxt{position:absolute;left:18px;top:16px;bottom:14px;z-index:1;color:#fff;display:flex;flex-direction:column;gap:3px;max-width:62%}
.ptxt b{font-size:22px;font-weight:800;letter-spacing:.04em}
.ptxt span{font-size:15px;font-weight:700;color:#ffd36b}
.ptxt em{font-style:normal;font-size:12.5px;color:#dfe8f8}
.ptxt .badge{align-self:flex-start;margin-top:auto;background:rgba(255,255,255,.93)}
.upph{height:110px;margin:-16px -16px 12px;border-radius:16px 16px 0 0;overflow:hidden}
.upph img{width:100%;height:100%;object-fit:cover;display:block}
#login{background:linear-gradient(135deg,rgba(0,40,120,.93),rgba(0,30,90,.80)),var(--lgimg) center/cover no-repeat}
#login:before{content:"";position:absolute;right:0;bottom:0;width:45%;height:55%;background:var(--lgimg2) center/cover;opacity:.18;border-top-left-radius:40px;pointer-events:none}
.lbox{position:relative;z-index:1}
@media (max-width:980px){.ptiles.three{grid-template-columns:1fr}.abtxt{max-width:100%}.abanner img{width:100%;opacity:.35}}
@media (max-width:640px){.ptiles{grid-template-columns:1fr}}

.ptile.full img{object-position:center 92%}
.ptile.sencillo img{object-position:center 60%}

/* ===== Bienvenida ejecutiva ===== */
.hx{padding:30px 34px 22px}
.hx .hx-top h1{font-size:36px;font-weight:800;letter-spacing:-.02em}
.hx-lead{margin:6px 0 0;color:#c9d7f2;font-size:14.5px}.hx-lead b{color:#fff}
.hx-verdict{position:relative;z-index:1;margin:18px 0 18px;padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.08);border-left:4px solid var(--accent);font-size:15.5px;color:#eef3ff;line-height:1.55}
.hx-verdict .badge{vertical-align:2px}
.hx-best{display:inline-block;margin-left:6px;background:var(--accent);color:#0b2a5b;font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px}
.hx-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.hx-panel{background:rgba(5,20,50,.35);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px 18px;backdrop-filter:blur(4px)}
.hx-ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hx-tag{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px 6px 8px;border-radius:10px;background:#2a78d6}
.hx-panel.ops .hx-tag{background:#12946b}
.hx-tag svg{width:20px;height:20px}
.hx-per{color:#b9cbe9;font-size:12.5px;font-weight:700}
.hx-main{display:flex;align-items:center;gap:14px}
.gauge{width:150px;flex:none}
.gauge .gv{fill:#fff;font-size:24px;font-weight:800}.gauge .gl{fill:#b9cbe9;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.hx-big{display:flex;flex-direction:column;gap:3px;min-width:0}
.hx-k{font-size:11.5px;font-weight:800;color:#b9cbe9;text-transform:uppercase;letter-spacing:.05em}
.hx-big b{font-size:40px;font-weight:800;line-height:1.05;color:#fff}.hx-big b small{font-size:15px;color:#c9d7f2;font-weight:700}
.hx-s{font-size:12.5px;color:#c9d7f2}
.hx-eval{align-self:flex-start;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.92)}
.hx-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 12px}
.hx-stats div{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.hx-stats span{display:block;font-size:11px;color:#b9cbe9;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.hx-stats b{display:block;font-size:20px;color:#fff;margin:2px 0}.hx-stats em{font-style:normal;font-size:11.5px;color:#c9d7f2}
.hx-sub{font-size:11.5px;font-weight:800;color:#b9cbe9;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.hx-prices{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.hp{background:rgba(255,255,255,.95);color:#0f1a2b;border-radius:11px;padding:8px 10px;border-top:3px solid #9fb3d6}
.hp b{display:block;font-size:18px;font-weight:800}.hp span{display:block;font-size:12.5px;font-weight:700;color:#24324a}.hp em{display:block;font-style:normal;font-size:10.5px;color:#6b778a}
.hp.lo{border-top-color:#0ca30c}.hp.lo em{color:#006300;font-weight:700}
.hp.hi{border-top-color:#d03b3b}.hp.hi em{color:#b42828;font-weight:700}
.hx-none{color:#c9d7f2}
.hx-foot{position:relative;z-index:1;margin:14px 0 0;color:#9fb3d6;font-size:11.5px}
.abanner.chofer img{object-position:center 25%}
@media (max-width:980px){.hx-grid{grid-template-columns:1fr}.hx .hx-top h1{font-size:28px}.hx-stats{grid-template-columns:1fr 1fr}}

.abanner.portrait img{width:320px;object-position:center 18%}
.abanner.portrait:before{background:linear-gradient(90deg,#0b2a5b 0%,#0b2a5b calc(100% - 318px),rgba(11,42,91,0) calc(100% - 170px))}
.abanner.ops.portrait:before{background:linear-gradient(90deg,#0a3d33 0%,#0d4a3d calc(100% - 318px),rgba(13,74,61,0) calc(100% - 170px))}
.ghbar{background:#fff4d6;color:#7a5200;text-align:center;padding:8px;font-weight:700;font-size:13px}.ghbar .lnk{color:#0b2a5b;text-decoration:underline}</style>

  }

  const link = cfg.area ? '<a class="btn ghost sm" href="#' + (cfg.area === 'log' ? 'logistica' : 'operaciones') + '-comparador">Comparar móvil vs móvil, región vs región o marca vs marca →</a>' : '';
  return '<details class="card cmp" id="' + id + '"' + (st.open ? ' open' : '') + '><summary class="ch"><div><h3>Comparativo de periodos</h3><p class="sub">Haz clic para abrir · compara dos periodos y explica por qué cambió el gasto</p></div><span class="chev">▾</span></summary><div class="cb"><div class="cmpbar"><label>Periodo A ' + sel('a') + '</label><span class="vs">vs</span><label>Periodo B ' + sel('b') + '</label>' + link + '</div>' + note + '<div class="cmpout"></div></div></details>';

  const st = CMP[key]; const A = opts.find(o => o.v === st.a), B = opts.find(o => o.v === st.b);

  s += '</div>';

    const names = Array.from(new Set(g.rows.map(r => r.n).concat(gb.rows.map(r => r.n))));

      const sorted = valid.slice().sort((x, y) => (y.p || 0) - (x.p || 0));
      const best = g.good === 'up' ? sorted[0] : sorted[sorted.length - 1], worst = g.good === 'up' ? sorted[sorted.length - 1] : sorted[0];

  flush();
}

/* ===================== Vistas y cálculos ===================== */
const AREA_DS = {
  log: { rend: ['log_rend'], cargas: 'log_cargas', ral: 'log_ral', chof: 'log_chof' },
  ops: { rend: ['ops_rend_d', 'ops_rend_g'], cargas: 'ops_cargas', ral: 'ops_ral', chof: 'ops_chof' }
};
const AREA_NAME = { log: 'Logística', ops: 'Operaciones' };
const SLUG = { log: 'logistica', ops: 'operaciones' };
const TABS = [['rendimientos', 'Rendimientos'], ['cargas', 'Cargas de combustible'], ['ralenti', 'Ralentí'], ['choferes', 'Choferes'], ['comparador', 'Comparador']];

function areaMonths(a) { const s = new Set(); const d = AREA_DS[a]; [].concat(d.rend, [d.cargas, d.ral, d.chof]).forEach(x => periodsOf(x).forEach(p => s.add(p))); return Array.from(s).sort(); }
function latest(dsList) { const all = [].concat(dsList).flatMap(d => periodsOf(d)).sort(); return all[all.length - 1] || null; }
function tog(k, def) { return S.toggles[k] === undefined ? def : S.toggles[k]; }
function ensureFilters(a) {
  const f = S.f[a]; const ms = areaMonths(a);
  if (!f.mes || ms.indexOf(f.mes) < 0) f.mes = latest(AREA_DS[a].rend) || ms[ms.length - 1] || null;
  if (!f.desde && f.mes) { f.desde = f.mes + '-01'; f.hasta = monthEnd(f.mes); }
  f.region = f.region || 'ALL'; f.suc = f.suc || 'ALL'; f.comb = f.comb || 'ALL';
  f.cProv = f.cProv || 'ALL'; f.cMet = f.cMet || 'L'; f.geo = f.geo || 'ALL'; f.rMet = f.rMet || 'L';
  f.rDias = f.rDias || setting('ralMinDias');
  return f;
}

/* ---------- Rendimientos Logística ---------- */
function sm(m) { return String(m || '').trim().replace('FREIGHTLINER CASCADIA DETROIT DIESEL', 'Cascadia').replace('INTERNACIONAL', 'Intl').replace('KENWORTH', 'KW').replace('AUTOMATICO', 'aut.').replace(/ 450 HP/, ''); }
function modalidad(r) { if (r.full === null && r.senc === null) return 'S/D'; if ((r.full || 0) >= 0.7) return 'FULL'; if ((r.senc || 0) >= 0.7) return 'SENCILLO'; return 'MIXTO'; }
function logSrc() { return S.toggles.logSrc || 'S'; }
// Ideal ponderado por modalidad: litros ideales = km·%Full / idealFull + km·%Sencillo / idealSenc
function logIdeal(r) {
  if (r.tipo !== 'TRACTO') return null;
  const fu = r.full || 0, se = r.senc || 0, t = fu + se;
  if (!(t > 0)) return null;
  const iF = setting('idealFull'), iS = setting('idealSenc');
  return 1 / ((fu / t) / iF + (se / t) / iS);

// Mezcla Full/Sencillo por tracto de todos los meses, para meses cuyo semáforo no la trae
let MIXK = null, MIX = null;
function mixOf(eco, p) {
  if (MIXK !== S.ver) {
    MIX = { by: {}, fleet: null }; MIXK = S.ver; let kf = 0, kt = 0;
    for (const q of periodsOf('log_rend')) for (const r of rowsOf('log_rend', q)) {
      const t = (r.full || 0) + (r.senc || 0); if (!(t > 0)) continue;
      (MIX.by[r.eco] = MIX.by[r.eco] || []).push({ q, f: (r.full || 0) / t }); kf += r.km * (r.full || 0) / t; kt += r.km;
    }
    MIX.fleet = kt ? kf / kt : 0.6;
  }
  const L = MIX.by[eco];
  if (L && L.length) { const pn = n => { const [y, m] = n.split('-').map(Number); return y * 12 + m; }; const best = L.slice().sort((a, b) => Math.abs(pn(a.q) - pn(p)) - Math.abs(pn(b.q) - pn(p)))[0]; return { f: best.f, src: 'otro mes' }; }
  return { f: MIX.fleet, src: 'promedio flota' };
}
function normZona(z) { z = String(z || '').toUpperCase().trim(); return z.replace(/^LOG\s*(?=CENTRO|NORTE|SUR|OCCIDENTE|NOROESTE|PACIFICO|PXGL)/, '') || 'SIN ZONA'; }
function logRendRows(p, ignoreRegion, src) {
  const f = S.f.log; src = src || logSrc();
  return rowsOf('log_rend', p).map(r0 => {
    const zona = normZona(r0.zona); const t = (r0.full || 0) + (r0.senc || 0);
    if (t > 0 || r0.tipo !== 'TRACTO') return zona === r0.zona ? r0 : Object.assign({}, r0, { zona });
    const m = mixOf(r0.eco, p); return Object.assign({}, r0, { zona, full: m.f, senc: 1 - m.f, mixEst: m.src });
  }).filter(r => (r.tipo === 'TRACTO' || tog('logTK', false)) && (!r.wialon || tog('logWialon', true)) && (ignoreRegion || f.region === 'ALL' || r.zona === f.region) && (r.km > 0 || r.lts > 0)).map(r => {
    const useS = src === 'S' && r.rendS > 0 && r.km > 0;
    const ideal = logIdeal(r);
    return Object.assign({}, r, { rendM: r.rend, ltsM: r.lts, lts: useS ? r.km / r.rendS : r.lts, rend: useS ? r.rendS : r.rend, src: useS ? 'S' : 'M', ideal, li: ideal ? r.km / ideal : 0 });

function aggLog(rows, key) {

}

/* ---------- Rendimientos Operaciones ---------- */
function marcaOps(d) { d = d || ''; if (/HINO/.test(d)) return 'HINO'; if (/FREIGHTLINER/.test(d)) return 'FREIGHTLINER'; if (/TRANSPORTER|CADDY|CRAFTER/.test(d)) return 'VOLKSWAGEN'; if (/HIACE|TOYOTA/.test(d)) return 'TOYOTA'; if (/SPRINTER/.test(d)) return 'MERCEDES-BENZ'; if (/PEUGEOT|PARTNER/.test(d)) return 'PEUGEOT'; if (/TRANSIT/.test(d)) return 'FORD'; return d.split(' ')[0] || 'OTRA'; }
function tecOps(r) { return r.comb === 'GASOLINA' ? 'Gasolina' : /HIBRIDO/.test(r.desc) ? 'Diésel híbrido' : 'Diésel convencional'; }
function tamOps(r) { return /RABON/.test(r.desc) ? 'Pesado (rabón)' : /HINO|FREIGHTLINER/.test(r.desc) ? 'Mediano (camión)' : 'Ligero (van)'; }
function idealOf(r) { return r.ideal || (r.comb === 'GASOLINA' ? setting('idealGas') : null); }
function opsRendRows(p, o) {
  o = o || {}; const f = S.f.ops; let out = [];
  for (const ds of AREA_DS.ops.rend) { if ((f.comb === 'DIESEL' && ds === 'ops_rend_g') || (f.comb === 'GASOLINA' && ds === 'ops_rend_d')) continue; out = out.concat(rowsOf(ds, p)); }
  return out.filter(r => (o.allCasos || r.caso === 'N' || tog('opsCasos', false)) && (o.ignoreRegion || f.region === 'ALL' || r.region === f.region) && (o.ignoreRegion || f.suc === 'ALL' || r.suc === f.suc) && (!tog('opsAtip', false) || r.caso !== 'N' || !idealOf(r) || (r.rend / idealOf(r) <= 2.5 && r.rend / idealOf(r) >= 0.3)));
}
function aggOps(rows, key) {
  const m = groupBy(rows, key); const out = [];
  for (const [n, g] of m) {
    const km = sum(g, 'km'), lts = sum(g, 'lts'), imp = sum(g, 'imp'); let li = 0, lr = 0, ki = 0; let bajo = 0, nu = 0;
    for (const r of g) { const id = idealOf(r); if (id) { li += r.km / id; lr += r.lts; ki += r.km; if (r.caso === 'N' && r.lts > 0) { nu++; if (r.km / r.lts / id < 0.9) bajo++; } } }
    out.push({ n, u: g.length, km, lts, imp, rend: div(km, lts), ideal: div(ki, li), cump: div(li, lr), precio: div(imp, lts), bajo, pBajo: div(bajo, nu), lExc: Math.max(0, lr - li) });
  }
  return out.sort((a, b) => (b.cump || 0) - (a.cump || 0));
}
function opsStats(rows) { const a = aggOps(rows, () => 'T')[0] || { km: 0, lts: 0, imp: 0, u: 0 }; return a; }
function opsUnits(rows) {
  const minKm = setting('minKmOps');
  return rows.filter(r => r.caso === 'N' && r.km >= minKm && r.lts > 0 && idealOf(r)).map(r => { const id = idealOf(r); const rend = r.km / r.lts; return { movil: r.movil, suc: r.suc, region: r.region, desc: r.desc, comb: r.comb, km: r.km, lts: r.lts, rend, ideal: id, cump: rend / id, exc: Math.max(0, r.lts - r.km / id), excImp: Math.max(0, r.lts - r.km / id) * div(r.imp, r.lts) }; });
}

/* ===================== Comparativos: explicación de causas y comparador de entidades ===================== */
function money(v) { return (v < 0 ? '−' : '+') + '$' + nf(0).format(Math.abs(v)); }
function effTag(v, isCost) { const cls = Math.abs(v) < 1 ? '' : (isCost ? (v > 0 ? 'up' : 'down') : (v > 0 ? 'down' : 'up')); return '<span class="eff ' + cls + '">' + money(v) + '</span>'; }
function pctTxt(a, b) { if (!a) return ''; const p = (b - a) / Math.abs(a); return (p >= 0 ? '+' : '−') + nf(1).format(Math.abs(p) * 100) + '%'; }
function selMonth(sel) { return sel.v.slice(0, 7); }

/* ---- Rendimientos: ¿por qué gasté más o menos? ---- */
function rendPeriodStats(a, p) {
  const rows = a === 'log' ? logRendRows(p) : opsRendRows(p);
  const st = a === 'log' ? logRendStats(rows) : opsStats(rows);
  const lc = a === 'log' ? sum(rows, r => r.ltsCarg || 0) : 0;
  const P = a === 'log' ? div(st.imp, lc || st.lts) : div(st.imp, st.lts);
  const out = { rows, km: st.km, L: st.lts, rend: st.rend, ideal: st.ideal, cump: st.cump, G: st.imp, P, u: rows.length };
  if (a === 'log') { const kmF = sum(rows, r => r.km * (r.full || 0)), kmS = sum(rows, r => r.km * (r.senc || 0)); out.pFull = div(kmF, kmF + kmS); }
  else { out.pGas = div(sum(rows.filter(r => r.comb === 'GASOLINA'), 'km'), st.km); out.tipos = aggOps(rows, r => r.desc); }
  const ral = ralRows(a, p + '-01', monthEnd(p), true); out.ralL = sum(ral, 'lts'); out.ralEv = ral.length; out.hasRal = periodsOf(a + '_ral').indexOf(p) >= 0;
  const ch = choferRows(a, p); out.chH = sum(ch, 'hr'); out.chHm = sum(ch, 'hm'); out.hasCh = ch.length > 0;
  return out;
}
function storyRend(a, A, B) {
  const pa = selMonth(A), pb = selMonth(B);
  const x = rendPeriodStats(a, pa), y = rendPeriodStats(a, pb);
  if (!x.km || !y.km) return null;
  const dG = y.G - x.G;
  const ePrecio = (y.P - x.P) * y.L;
  const eKm = (y.km - x.km) / x.rend * x.P;
  const eRend = (y.km / y.rend - y.km / x.rend) * x.P;
  // parte del rendimiento que se explica por la mezcla (modalidad / tipo de unidad) vía el ideal ponderado
  const rendMix = x.ideal && y.ideal ? x.rend * y.ideal / x.ideal : x.rend;
  const eMix = (y.km / rendMix - y.km / x.rend) * x.P;
  const eEfic = eRend - eMix;
  const eOtro = dG - ePrecio - eKm - eRend;
  const L = [];
  L.push('<b>El gasto ' + (dG >= 0 ? 'subió' : 'bajó') + ' $' + nf(0).format(Math.abs(dG)) + ' (' + pctTxt(x.G, y.G) + ')</b>, de ' + F.money(x.G) + ' a ' + F.money(y.G) + '. Así se reparte la diferencia:');
  const parts = [
    { v: ePrecio, t: '<b>Precio del diésel</b>: pasó de ' + F.money2(x.P) + ' a ' + F.money2(y.P) + ' por litro (' + pctTxt(x.P, y.P) + ').' },
    { v: eKm, t: '<b>Kilómetros recorridos</b>: de ' + F.n0(x.km) + ' a ' + F.n0(y.km) + ' km (' + pctTxt(x.km, y.km) + ')' + (x.u !== y.u ? ', con ' + F.n0(x.u) + ' → ' + F.n0(y.u) + ' unidades' : '') + '. Más km implica más litros aunque el rendimiento no cambie.' },
    { v: eMix, t: a === 'log' ? '<b>Modalidad (Full / Sencillo)</b>: los km en Full pasaron de ' + F.pct(x.pFull) + ' a ' + F.pct(y.pFull) + '; eso movió el ideal ponderado de ' + F.kml(x.ideal) + ' a ' + F.kml(y.ideal) + '. Más Full = rendimiento esperado menor.' : '<b>Mezcla de unidades</b>: cambió la participación de tipos de unidad' + (y.pGas !== null ? ' (gasolina ' + F.pct(x.pGas) + ' → ' + F.pct(y.pGas) + ' de los km)' : '') + '; el ideal ponderado pasó de ' + F.kml(x.ideal) + ' a ' + F.kml(y.ideal) + '.' },
    { v: eEfic, t: '<b>Eficiencia de manejo y operación</b>: el cumplimiento contra el ideal pasó de ' + F.pct(x.cump) + ' a ' + F.pct(y.cump) + ' (rendimiento real ' + F.kml(x.rend) + ' → ' + F.kml(y.rend) + ').' },
    { v: eOtro, t: '<b>Otros</b>: diferencia entre litros cargados y consumidos (inventario en tanque, cargas de otro mes, rentas) y redondeos.' }
  ].sort((p, q) => Math.abs(q.v) - Math.abs(p.v));
  parts.forEach(pt => { if (Math.abs(pt.v) >= 1) L.push(effTag(pt.v, true) + ' ' + pt.t); });
  // ralentí
  if (x.hasRal && y.hasRal) L.push('<b>Ralentí</b> (eventos registrados): ' + F.L(x.ralL) + ' → ' + F.L(y.ralL) + ' (' + pctTxt(x.ralL, y.ralL) + '); a ' + F.money2(y.P) + '/L equivale a ' + effTag((y.ralL - x.ralL) * y.P, true) + '.' + (x.hasCh && y.hasCh ? ' Según el archivo de choferes, el ralentí pasó de ' + F.pct(div(x.chH, x.chHm)) + ' a ' + F.pct(div(y.chH, y.chHm)) + ' del tiempo de motor.' : ''));
  else if (x.hasCh && y.hasCh) L.push('<b>Ralentí</b> (archivo de choferes): pasó de ' + F.pct(div(x.chH, x.chHm)) + ' a ' + F.pct(div(y.chH, y.chHm)) + ' del tiempo de motor (' + F.n0(x.chH) + ' → ' + F.n0(y.chH) + ' h).');
  else L.push('<span class="muted">Ralentí: no hay archivos de ralentí o choferes de ambos meses para medir su efecto.</span>');
  // contribución por región
  const key = a === 'log' ? (r => r.zona) : (r => r.region);
  const gA = groupBy(x.rows, key), gB = groupBy(y.rows, key);
  const regs = Array.from(new Set([...gA.keys(), ...gB.keys()])).map(n => ({ n, d: sum(gB.get(n) || [], 'imp') - sum(gA.get(n) || [], 'imp') })).sort((p, q) => Math.abs(q.d) - Math.abs(p.d)).slice(0, 3);
  const onlyA = [...gA.keys()].filter(k => !gB.has(k)), onlyB = [...gB.keys()].filter(k => !gA.has(k));
  if (regs.length) L.push('<b>Regiones que más movieron el gasto</b>: ' + regs.map(r => esc(r.n) + ' ' + money(r.d)).join(' · ') + '.' + (onlyA.length && onlyB.length ? ' <span class="muted">Ojo: los nombres de región cambian entre meses (' + onlyA.map(esc).join(', ') + ' vs ' + onlyB.map(esc).join(', ') + '), así que esas regiones no se comparan una contra otra.</span>' : ''));
  if (a === 'ops' && x.tipos && y.tipos) {
    const tA = new Map(x.tipos.map(t => [t.n, t])), ch = y.tipos.map(t => ({ n: t.n, d: t.imp - ((tA.get(t.n) || {}).imp || 0) })).sort((p, q) => Math.abs(q.d) - Math.abs(p.d)).slice(0, 3);
    L.push('<b>Tipos de unidad que más movieron el gasto</b>: ' + ch.map(t => esc(t.n) + ' ' + money(t.d)).join(' · ') + '.');
  }
  const main = parts[0];
  L.push('<b>Conclusión</b>: el factor de mayor peso fue ' + main.t.split('</b>')[0].replace('<b>', '').toLowerCase() + ' (' + money(main.v) + ')' + (Math.abs(ePrecio) > Math.abs(dG) * 0.5 ? '; el cambio en el gasto se explica sobre todo por el precio, que no depende de la operación.' : eEfic < 0 ? '; la mejora en eficiencia ayudó a contener el gasto.' : eEfic > 0 ? '; la pérdida de eficiencia es controlable y vale la pena atacarla con las unidades y regiones en área de oportunidad.' : '.'));
  return L;
}

/* ---- Cargas ---- */
function storyCargas(a, A, B) {
  const ra = cargasRows(a, A.from, A.to), rb = cargasRows(a, B.from, B.to); const cg = CG[a];
  const x = cargasStats(a, ra), y = cargasStats(a, rb); if (!x.lts || !y.lts) return null;
  const pAuto = rr => div(sum(rr.filter(cg.auto), cg.amt), sum(rr.filter(cg.auto), 'lts')), pExt = rr => div(sum(rr.filter(r => !cg.auto(r)), cg.amt), sum(rr.filter(r => !cg.auto(r)), 'lts'));
  const dG = y.imp - x.imp, eVol = (y.lts - x.lts) * x.precio;
  const pMix = (x.pAuto || 0) * (pAuto(rb) || 0) + (1 - (x.pAuto || 0)) * (pExt(rb) || 0);
  const ePrecioPuro = (pMix - x.precio) * y.lts, eMezcla = (y.precio - pMix) * y.lts;
  const L = ['<b>El importe ' + (dG >= 0 ? 'subió' : 'bajó') + ' $' + nf(0).format(Math.abs(dG)) + ' (' + pctTxt(x.imp, y.imp) + ')</b>, de ' + F.money(x.imp) + ' a ' + F.money(y.imp) + ':'];
  [{ v: eVol, t: '<b>Volumen</b>: ' + F.L(x.lts) + ' → ' + F.L(y.lts) + ' (' + pctTxt(x.lts, y.lts) + '); por día ' + F.n0(div(x.lts, x.dias)) + ' → ' + F.n0(div(y.lts, y.dias)) + ' L.' },
   { v: ePrecioPuro, t: '<b>Precio del combustible</b>: autoconsumo ' + F.money2(pAuto(ra)) + ' → ' + F.money2(pAuto(rb)) + ', gasolineras ' + F.money2(pExt(ra)) + ' → ' + F.money2(pExt(rb)) + '.' },
   { v: eMezcla, t: '<b>Mezcla autoconsumo / gasolinera</b>: el autoconsumo pasó de ' + F.pct(x.pAuto) + ' a ' + F.pct(y.pAuto) + ' de los litros. Cargar más en autoconsumo abarata el litro promedio.' }]
    .sort((p, q) => Math.abs(q.v) - Math.abs(p.v)).forEach(p => { if (Math.abs(p.v) >= 1) L.push(effTag(p.v, true) + ' ' + p.t); });
  const pa = aggC(a, ra, cg.prov), pb = aggC(a, rb, cg.prov); const mA = new Map(pa.map(p => [p.n, p]));
  const top = pb.map(p => ({ n: p.n, d: p.imp - ((mA.get(p.n) || {}).imp || 0) })).sort((p, q) => Math.abs(q.d) - Math.abs(p.d)).slice(0, 3);
  L.push('<b>Proveedores que más movieron el importe</b>: ' + top.map(t => esc(t.n) + ' ' + money(t.d)).join(' · ') + '.');
  return L;
}

function pendCard(x, i) {

function dedupPlan(ds, rows) {
  const by = {}; for (const r of rows) (by[r.fecha.slice(0, 7)] = by[r.fecha.slice(0, 7)] || []).push(r);
  const plan = {};
  for (const p in by) {
    const cnt = new Map(); for (const r of rowsOf(ds, p)) { const k = FP.rowKey(ds, r); cnt.set(k, (cnt.get(k) || 0) + 1); }
    const nuevos = []; let dup = 0;
    for (const r of by[p]) { const k = FP.rowKey(ds, r); const c = cnt.get(k) || 0; if (c > 0) { cnt.set(k, c - 1); dup++; } else nuevos.push(r); }
    plan[p] = { nuevos: nuevos.length, dup, add: nuevos };
  }
  return plan;
}
async function readFile(file, area) {
  const name = file.name;
  try {
    let payload;
    if (/\.csv$/i.test(name)) { const buf = await file.arrayBuffer(); let txt = new TextDecoder('utf-8', { fatal: false }).decode(buf); if (txt.indexOf('\uFFFD') >= 0) txt = new TextDecoder('windows-1252').decode(buf); payload = { text: txt }; }
    else {
      const XLSX = await loadXLSX(); const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      const sheets = {}; wb.SheetNames.forEach(sn => { sheets[sn] = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: null, blankrows: false }); });
      payload = { sheets };
    }
    const out = FP.parseFile(area, name, payload);
    if (out.error) return { file: name, error: out.error };
    out.results.forEach(r => { if (!FP.MONTHLY[r.ds]) r.byMonth = dedupPlan(r.ds, r.rows); });
    return { file: name, results: out.results };
  } catch (e) { console.error(e); return { file: name, error: 'No se pudo leer: ' + e.message }; }
}
async function saveAll() {
  const btn = $('[data-act="saveAll"]'); if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  let ok = 0;
  try {
    for (const x of PEND) {
      if (x.error) continue;
      for (const r of x.results) {
        if (FP.MONTHLY[r.ds]) {
          if (!r.period) { toast('Elige el mes de ' + x.file, 'warn'); continue; }
          await savePeriod(r.ds, r.period, r.rows, { file: x.file });
          await logUpload({ at: new Date().toISOString(), file: x.file, ds: r.ds, period: r.period, added: r.rows.length, dup: 0, mode: 'reemplazo' });
        } else {
          const plan = dedupPlan(r.ds, r.rows);
          for (const p in plan) {
            if (!plan[p].add.length) continue;
            const merged = rowsOf(r.ds, p).concat(plan[p].add).sort((u, v) => (u.fecha + (u.hora || '')) < (v.fecha + (v.hora || '')) ? -1 : 1);
            await savePeriod(r.ds, p, merged, { file: x.file });

          }

  } catch (e) {
    console.error(e);

}

const AUTH = '2f8fb2e847074c8cab86398fa048275174ac4cfab7007adda9400383810dfe61';
async function sha256(t) {

function authed() { try { return sessionStorage.getItem('pc-auth') === AUTH || localStorage.getItem('pc-auth') === AUTH; } catch (e) { return false; } }
function loginGate() {
  return new Promise(res => {
    if (authed()) { document.body.classList.add('authed'); return res(); }
    const fm = document.querySelector('#login form');
    fm.addEventListener('submit', async e => {
